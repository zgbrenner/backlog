name: Windows pilot package

on:
  workflow_dispatch:
    inputs:
      llama_server_url:
        description: Direct HTTPS URL to a trusted llama-server.exe build
        required: true
        type: string
      llama_server_sha256:
        description: Expected lowercase SHA-256 for llama-server.exe
        required: true
        type: string
      model_bundle_url:
        description: Direct HTTPS URL to the reviewed BackLog model-bundle ZIP
        required: true
        type: string
      model_bundle_sha256:
        description: Expected lowercase SHA-256 for the model-bundle ZIP
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts

      - name: Validate frontend
        run: npm run check

      - name: Run lightweight Python tests
        shell: pwsh
        run: |
          python -m unittest discover -s sidecar/tests -v
          python -m unittest discover -s models/tests -v
          python -m compileall -q sidecar models training power-automate scripts

      - name: Build and smoke-test convertd
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 -Python python -TargetTriple x86_64-pc-windows-msvc

      - name: Stage and verify llama-server
        shell: pwsh
        env:
          LLAMA_URL: ${{ inputs.llama_server_url }}
          LLAMA_SHA256: ${{ inputs.llama_server_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $destination = "src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe"
          Invoke-WebRequest -Uri $env:LLAMA_URL -OutFile $destination
          $actual = (Get-FileHash -Algorithm SHA256 $destination).Hash.ToLowerInvariant()
          if ($actual -ne $env:LLAMA_SHA256.ToLowerInvariant()) {
            throw "llama-server hash mismatch. Expected $env:LLAMA_SHA256, got $actual"
          }

      - name: Stage and verify the reviewed model bundle
        shell: pwsh
        env:
          MODEL_BUNDLE_URL: ${{ inputs.model_bundle_url }}
          MODEL_BUNDLE_SHA256: ${{ inputs.model_bundle_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "backlog-models.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "backlog-models"
          Invoke-WebRequest -Uri $env:MODEL_BUNDLE_URL -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:MODEL_BUNDLE_SHA256.ToLowerInvariant()) {
            throw "model bundle hash mismatch. Expected $env:MODEL_BUNDLE_SHA256, got $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $expanded -Force
          $source = $expanded
          if (Test-Path (Join-Path $expanded "models\models.lock.json")) {
            $source = Join-Path $expanded "models"
          }
          if (-not (Test-Path (Join-Path $source "models.lock.json"))) {
            throw "model bundle must contain models.lock.json at its root or under models/"
          }
          Copy-Item -Path (Join-Path $source "*") -Destination "models" -Recurse -Force
          python models/download_models.py --verify-only
          foreach ($required in @(
            "models/Qwen3-0.6B-Q8_0.gguf",
            "models/Qwen3-1.7B-Q8_0.gguf",
            "models/gliclass-base-v3.0",
            "models/granite-embedding-small-english-r2"
          )) {
            if (-not (Test-Path $required)) {
              throw "required model asset is missing: $required"
            }
          }

      - name: Build Tauri NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Write package checksums
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path)" } |
            Set-Content -Encoding UTF8 package-checksums.txt

      - name: Upload unsigned pilot installer
        uses: actions/upload-artifact@v7
        with:
          name: backlog-windows-pilot-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/**
            package-checksums.txt
            sidecar/sidecar-build-lock.txt
            models/models.lock.json
          if-no-files-found: error
          retention-days: 7
