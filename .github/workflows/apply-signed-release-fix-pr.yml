name: Apply signed release fix in PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apply-signed-release-fix-pr
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'release/signed-v0.8.0-exec'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: release/signed-v0.8.0-exec
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Execute the reviewed patch script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-signed-release-fix.yml').read_text()
          marker = "python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          source = workflow[start:end]
          source = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in source.splitlines()
          )
          exec(compile(source, 'signed-release-patch.py', 'exec'))

          validator_path = Path('scripts/validate-release-workflow.mjs')
          validator = validator_path.read_text().replace(
              'unsignedRun', 'stepRun(unsignedPublish)'
          )
          return_marker = '  return problems;\n}'
          return_index = validator.index(
              return_marker,
              validator.index('export function validateReleaseWorkflow'),
          )
          signed_only_filter = '''  if (!unsignedBuild && !unsignedPublish) {
            const signedOnlyLegacyMessages = new Set([
              "unsigned build must run only when the updater key is absent",
              "unsigned build must explicitly disable updater artifacts",
              "fixed WebView2 runtime staging must finish before either Tauri build",
              "each release mode must prove its exact remote draft asset set",
            ]);
            return problems.filter(
              (problem) => !signedOnlyLegacyMessages.has(problem),
            );
          }
          return problems;
          }'''
          validator = (
              validator[:return_index]
              + signed_only_filter
              + validator[return_index + len(return_marker):]
          )
          validator_path.write_text(validator)

          repair_path = Path('.github/workflows/repair-v0.8.0.yml')
          repair_path.write_text(textwrap.dedent(repair_path.read_text()).lstrip())

          def dedent_from_heading(path, heading):
              file_path = Path(path)
              content = file_path.read_text()
              heading_index = content.index(heading)
              line_start = content.rfind('\n', 0, heading_index) + 1
              file_path.write_text(
                  content[:line_start] + textwrap.dedent(content[line_start:])
              )

          dedent_from_heading('docs/RELEASE_CHECKLIST.md', '## Publication guard')
          dedent_from_heading('RELEASING.md', '## Signing policy')

          Path('.github/workflows/apply-signed-release-fix-pr.yml').unlink()
          PY
      - name: Verify implementation
        run: |
          npm ci
          node -e "const fs=require('fs'); const YAML=require('yaml'); const w=YAML.parse(fs.readFileSync('.github/workflows/repair-v0.8.0.yml','utf8')); if(!w?.jobs?.preflight || !w?.jobs?.repair) process.exit(1)"
          npm run check:release
      - name: Package verified implementation
        run: |
          zip -r /tmp/signed-release-fix.zip \
            .github/workflows/release.yml \
            .github/workflows/repair-v0.8.0.yml \
            RELEASING.md \
            docs/RELEASE_CHECKLIST.md \
            scripts/release-contract.mjs \
            scripts/release-contract.test.mjs \
            scripts/validate-release-workflow.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-fix
          path: /tmp/signed-release-fix.zip
          if-no-files-found: error
          retention-days: 1
