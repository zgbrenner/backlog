name: Apply reliability payload

on:
  push:
    branches:
      - work/finish-backlog-20260721
    paths:
      - .github/workflows/apply-reliability-payload.yml

permissions:
  contents: write

concurrency:
  group: apply-reliability-payload
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@v6
        with:
          ref: work/finish-backlog-20260721
          fetch-depth: 0

      - name: Verify and extract the staged source payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/backlog-reliability-payload.b64 > "${RUNNER_TEMP}/payload.tgz"
          echo "354e46c94dcc89088916a91c354658295a3dbc8b801d31d305135f9b221ddb12  ${RUNNER_TEMP}/payload.tgz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/payload.tgz"
          rm tools/backlog-reliability-payload.b64
          rmdir tools 2>/dev/null || true
          rm .github/workflows/apply-reliability-payload.yml

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Stage nonfunctional sidecar placeholders for compile checks
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/convertd-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/llama-server-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Validate frontend
        run: |
          npm install --ignore-scripts
          npm run check

      - name: Validate Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Validate Python utilities
        run: |
          python -m unittest discover -s sidecar/tests -v
          python -m compileall -q sidecar training models

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit the validated reliability checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BackLog CI Worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: make document processing instance safe"
          git push origin HEAD:work/finish-backlog-20260721
