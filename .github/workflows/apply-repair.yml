name: Finalize BackLog v0.6.0 branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/semantic-evidence-v0.6.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/semantic-evidence-v0.6.0
          fetch-depth: 0
      - name: Apply verified release patch and self-delete
        shell: bash
        run: |
          set -euo pipefail
          encoded="$RUNNER_TEMP/finalize.patch.xz.b64"
          archive="$RUNNER_TEMP/finalize.patch.xz"
          patch="$RUNNER_TEMP/finalize.patch"
          cat .github/.release-payload/part-* | tr -d '\r\n' > "$encoded"
          base64 --decode "$encoded" > "$archive"
          echo "7528cc38a729844f8de6ece298d86df9964b284df5f5adc40caeaffdb9b668f3  $archive" | sha256sum --check --strict
          xz --decompress --stdout "$archive" > "$patch"
          echo "afa73998e87742a22d7c42fd3ca466413ef242dc47040efd8c0de4085972c11a  $patch" | sha256sum --check --strict
          git show edfb90d12c798616150de262a8ed672b893bec2b:.github/workflows/apply-repair.yml > .github/workflows/apply-repair.yml
          git add .github/workflows/apply-repair.yml
          git apply --index --check "$patch"
          git apply --index "$patch"
          rm -rf .github/.release-payload .github/.final-payload .github/.repair-payload .github/.semantic-payload
          rm -f .github/workflows/apply-repair.yml .github/workflows/export-current-source.yml .github/workflows/finalize-release.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: finalize semantic evidence pipeline and v0.6.0 packaging"
          git push origin HEAD:feature/semantic-evidence-v0.6.0
