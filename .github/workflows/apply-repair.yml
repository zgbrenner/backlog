name: Apply reversible evidence trace lifecycle

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/semantic-evidence-v0.6.0'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/semantic-evidence-v0.6.0
          fetch-depth: 0
      - name: Apply tested trace lifecycle once
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'fn write_evidence_trace' src-tauri/src/pipeline.rs && \
             grep -q 'TRACE_WRITE_FAILED' docs/TROUBLESHOOTING.md; then
            echo 'Reversible evidence trace lifecycle is already present.'
            exit 0
          fi
          encoded="$RUNNER_TEMP/trace.patch.xz.b64"
          patch="$RUNNER_TEMP/trace.patch"
          cat .github/.repair-payload/part-* | tr -d '\r\n' > "$encoded"
          base64 --decode "$encoded" | xz --decompress > "$patch"
          echo "9fadc819d1e382424dbfe7bbd449ce03ce1bca660a0ce19b31ac99b7c3a3abfd  $patch" | sha256sum --check --strict
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am "$patch"
          cargo fmt --all --manifest-path src-tauri/Cargo.toml
          if ! git diff --quiet; then
            git add src-tauri/src/pipeline.rs
            git commit --amend --no-edit
          fi
          git push origin HEAD:feature/semantic-evidence-v0.6.0
