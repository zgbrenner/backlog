name: Apply semantic trace lifecycle contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/semantic-evidence-v0.6.0'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/semantic-evidence-v0.6.0
          fetch-depth: 0
      - name: Apply tested repair and trace contract once
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'evidence_trace_round_trips_and_metric_event_contains_no_source_text' src-tauri/src/pipeline.rs && \
             grep -q 'CARGO_MANIFEST_DIR' .github/scripts/check-troubleshooting-coverage.mjs; then
            echo 'Repair and trace contract are already present.'
            exit 0
          fi
          encoded="$RUNNER_TEMP/repair.patch.xz.b64"
          patch="$RUNNER_TEMP/repair.patch"
          cat .github/.repair-payload/part-* | tr -d '\r\n' > "$encoded"
          base64 --decode "$encoded" | xz --decompress > "$patch"
          echo "373f2b39c38090c257908e546c5d2135ffc9f293687f52dc8c7bfd14c44c6f68  $patch" | sha256sum --check --strict
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am "$patch"
          git push origin HEAD:feature/semantic-evidence-v0.6.0
