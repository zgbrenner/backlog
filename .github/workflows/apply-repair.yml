name: Apply final semantic evidence tree

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/semantic-evidence-v0.6.0'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/semantic-evidence-v0.6.0
          fetch-depth: 0
      - name: Apply reviewed final tree once
        shell: bash
        run: |
          set -euo pipefail
          encoded="$RUNNER_TEMP/final.patch.xz.b64"
          archive="$RUNNER_TEMP/final.patch.xz"
          patch="$RUNNER_TEMP/final.patch"
          tr -d '\r\n' < .github/.final-payload/final.patch.xz.b64 > "$encoded"
          base64 --decode "$encoded" > "$archive"
          echo "0793bfc94b80039138d4fb8528481e5dd4f0cc0cf5928ec52c4589747c5bd06d  $archive" | sha256sum --check --strict
          xz --decompress --stdout "$archive" > "$patch"
          echo "d39228e39bc1de2d387483902f182262eae446ab988af10360d32b7f85aa966d  $patch" | sha256sum --check --strict
          git apply --index --check "$patch"
          git apply --index "$patch"
          rm -rf .github/.final-payload .github/.repair-payload .github/.semantic-payload
          rm -f .github/workflows/apply-repair.yml .github/workflows/export-current-source.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Final tree is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: finalize semantic evidence pipeline and release hardening"
          git push origin HEAD:feature/semantic-evidence-v0.6.0
