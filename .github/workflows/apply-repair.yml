name: Apply semantic evidence lint repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/semantic-evidence-v0.6.0'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/semantic-evidence-v0.6.0
          fetch-depth: 0
      - name: Repair the clippy-only test fixture once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/src/pipeline.rs")
          text = path.read_text(encoding="utf-8")
          old = '''        let mut trace = filter::EvidenceTrace::default();
                  trace.routing = "semantic".into();
                  trace.semantic_available = true;
                  trace.entity_available = true;
                  trace.source_paragraphs = 10;
                  trace.selected_paragraphs = 3;
                  trace.compression = filter::CompressionMetrics {
                      source_chars: 1_000,
                      source_tokens_approx: 250,
                      bundle_chars: 400,
                      bundle_tokens_approx: 100,
                      saved_chars: 600,
                      savings_ratio: 0.6,
                  };
          '''
          new = '''        let mut trace = filter::EvidenceTrace {
                      routing: "semantic".into(),
                      semantic_available: true,
                      entity_available: true,
                      source_paragraphs: 10,
                      selected_paragraphs: 3,
                      compression: filter::CompressionMetrics {
                          source_chars: 1_000,
                          source_tokens_approx: 250,
                          bundle_chars: 400,
                          bundle_tokens_approx: 100,
                          saved_chars: 600,
                          savings_ratio: 0.6,
                      },
                      ..Default::default()
                  };
          '''
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit("expected clippy fixture was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          if git diff --quiet; then
            echo 'Lint repair is already present.'
            exit 0
          fi
          cargo fmt --all --manifest-path src-tauri/Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/pipeline.rs
          git commit -m "test: satisfy semantic trace clippy contract"
          git push origin HEAD:feature/semantic-evidence-v0.6.0
