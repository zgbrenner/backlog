name: Release BackLog

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

env:
  RELEASE_SHA: ${{ github.sha }}
  RELEASE_BRANCH: ${{ github.ref_name }}

jobs:
  release-check:
    name: Check whether the current release still needs publication
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      should-release: ${{ steps.release-gate.outputs.release }}
      version: ${{ steps.release-metadata.outputs.version }}
      tag: ${{ steps.release-metadata.outputs.tag }}
      portable: ${{ steps.release-metadata.outputs.portable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Wait for exact successful main CI
        id: ci-gate
        run: node scripts/release-contract.mjs ci-gate --sha "$RELEASE_SHA"
      - name: Read and validate release metadata
        id: release-metadata
        run: node scripts/release-contract.mjs metadata
      - name: Skip cleanly after the release tag exists
        id: release-gate
        env:
          TAG: ${{ steps.release-metadata.outputs.tag }}
        run: node scripts/release-contract.mjs gate

  release:
    name: Windows x64 package and publish
    needs: release-check
    if: needs.release-check.outputs.should-release == 'true'
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-check.outputs.version }}
      TAG: ${{ needs.release-check.outputs.tag }}
      INSTALLER: "src-tauri/target/release/bundle/nsis/BackLog_${{ needs.release-check.outputs.version }}_x64-setup.exe"
      PORTABLE: "src-tauri/target/release/${{ needs.release-check.outputs.portable }}"
      SIGNATURE: "src-tauri/target/release/bundle/nsis/BackLog_${{ needs.release-check.outputs.version }}_x64-setup.exe.sig"
      MANIFEST: "src-tauri/target/release/bundle/nsis/latest.json"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Set runner-local release paths
        shell: pwsh
        run: |
          $runtimeDir = Join-Path $env:RUNNER_TEMP "backlog-webview2-fixed"
          "WEBVIEW2_RUNTIME_DIR=$runtimeDir" >> $env:GITHUB_ENV

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            sidecar/requirements.lock
            sidecar/build-requirements.lock
            power-automate/requirements-dev.txt

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $match = Select-String -Path rust-toolchain.toml -Pattern 'channel\s*=\s*"([^"]+)"'
          if (-not $match) { throw "rust-toolchain.toml has no pinned channel" }
          $toolchain = $match.Matches[0].Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw "rustup failed" }
          rustup override set $toolchain
          if ($LASTEXITCODE -ne 0) { throw "could not activate pinned Rust" }
          $actual = rustc --version
          if ($actual -notmatch "^rustc $([regex]::Escape($toolchain))(\s|$)") {
            throw "Expected Rust $toolchain, got $actual"
          }

      - name: Select native Windows build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nasmVersion = "2.16.03"
          $nasmHash = "3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6"
          $nativeRoot = Join-Path $env:RUNNER_TEMP "backlog-native-tools"
          $nasmArchive = Join-Path $nativeRoot "nasm-$nasmVersion-win64.zip"
          New-Item -ItemType Directory -Path $nativeRoot -Force | Out-Null
          Invoke-WebRequest `
            -Uri "https://www.nasm.us/pub/nasm/releasebuilds/$nasmVersion/win64/nasm-$nasmVersion-win64.zip" `
            -OutFile $nasmArchive
          $actualNasmHash = (Get-FileHash -LiteralPath $nasmArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualNasmHash -ne $nasmHash) {
            throw "NASM archive hash mismatch: expected $nasmHash, got $actualNasmHash"
          }
          Expand-Archive -LiteralPath $nasmArchive -DestinationPath $nativeRoot -Force
          $nasmDir = Join-Path $nativeRoot "nasm-$nasmVersion"

          $nativePaths = @(
            "C:\Strawberry\perl\bin",
            "C:\Strawberry\c\bin",
            $nasmDir
          )
          foreach ($path in $nativePaths) {
            if (-not (Test-Path $path)) { throw "Required build tool path is missing: $path" }
            $env:Path = "$path;$env:Path"
            $path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $actualPerl = perl --version
          $perlExit = $LASTEXITCODE
          $perlText = $actualPerl -join "`n"
          if ($perlExit -ne 0 -or $perlText -notmatch "built for MSWin32-x64") {
            throw "Expected native x64 Strawberry Perl, got $perlText"
          }
          $actualPerl | Select-Object -First 2
          $actualNasm = nasm -v
          if ($LASTEXITCODE -ne 0 -or $actualNasm -notmatch "^NASM version $([regex]::Escape($nasmVersion))(\s|$)") {
            throw "Expected NASM $nasmVersion, got $actualNasm"
          }

      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          python -m pip install --disable-pip-version-check -r power-automate/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Power Automate dependency install failed" }

      - name: Validate release workflow
        run: npm run check:release

      - name: Validate frontend
        run: npm run check

      - name: Validate Power Automate
        run: python power-automate/validate_examples.py

      - name: Stage verified release inputs
        shell: pwsh
        run: ./scripts/stage-release-inputs.ps1 -Clean

      - name: Stage pinned fixed WebView2 runtime
        shell: pwsh
        run: ./scripts/stage-webview2-runtime.ps1 -Destination $env:WEBVIEW2_RUNTIME_DIR -Clean

      - name: Build sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 -Python (Get-Command python).Source -Clean

      - name: Verify release binaries
        shell: pwsh
        run: |
          ./scripts/verify-binaries.ps1 -Expected @{
            "llama-server-x86_64-pc-windows-msvc.exe" = "78af9cfb34f346b0de1e4f9c1577061cb3d55e8be55c8d540fde878e56bd0fe2"
          }

      - name: Select guarded release mode
        id: release-mode
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/release-contract.mjs mode

      - name: Build signed installer
        if: steps.release-mode.outputs.signed == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Build unsigned installer
        if: steps.release-mode.outputs.signed == 'false'
        run: npm run tauri build -- --config scripts/tauri.unsigned.conf.json

      - name: Build installer-free portable ZIP
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Version $env:VERSION -Output $env:PORTABLE -WebView2RuntimeDir $env:WEBVIEW2_RUNTIME_DIR

      - name: Verify installer-free portable ZIP
        shell: pwsh
        run: ./scripts/validate-portable-package.ps1 -Archive $env:PORTABLE -Version $env:VERSION

      - name: Write release notes
        shell: pwsh
        run: |
          if (-not (Test-Path $env:INSTALLER)) { throw "Expected installer missing: $env:INSTALLER" }
          if (-not (Test-Path $env:PORTABLE)) { throw "Expected portable ZIP missing: $env:PORTABLE" }
          $sha = (Get-FileHash $env:INSTALLER -Algorithm SHA256).Hash.ToLowerInvariant()
          $portableSha = (Get-FileHash $env:PORTABLE -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          BackLog $env:VERSION includes a one-download Windows installer and an
          installer-free portable ZIP. Both include the primary model, conversion
          runtime, llama server, and app-local runtime DLLs.

          This release adds Local Output: BackLog can write finished renamed
          documents directly to a selected local folder with one receipt per
          delivery under .backlog/receipts. The existing Power Automate /
          SharePoint mode is preserved and continues to write the Flow 2
          handoff manifest to Outbox. Local Output does not validate or replace
          a target tenant's Flow 1/Flow 2 configuration.

          Installer SHA-256: $sha
          Portable ZIP SHA-256: $portableSha
          The portable ZIP includes fixed WebView2 $((Get-Content (Join-Path $env:WEBVIEW2_RUNTIME_DIR 'runtime-manifest.json') -Raw | ConvertFrom-Json).version)
          under webview2-fixed and starts through BackLog-Portable.cmd; it does
          not require an Evergreen WebView2 install or a runtime download.
          "@ | Set-Content "$env:RUNNER_TEMP\release-notes.md" -Encoding utf8

      - name: Create signed updater manifest
        if: steps.release-mode.outputs.signed == 'true'
        shell: pwsh
        run: |
          node scripts/release-contract.mjs manifest `
            --version $env:VERSION `
            --repository $env:GITHUB_REPOSITORY `
            --installer (Split-Path $env:INSTALLER -Leaf) `
            --signature $env:SIGNATURE `
            --notes "$env:RUNNER_TEMP\release-notes.md" `
            --out $env:MANIFEST

      - name: Verify guarded artifact set
        shell: pwsh
        run: |
          node scripts/release-contract.mjs verify `
            --signed "${{ steps.release-mode.outputs.signed }}" `
            --installer $env:INSTALLER `
            --signature $env:SIGNATURE `
            --manifest $env:MANIFEST

      - name: Verify updater signature against embedded public key
        if: steps.release-mode.outputs.signed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $encoded = [string]$config.plugins.updater.pubkey
          if ([string]::IsNullOrWhiteSpace($encoded)) {
            throw "tauri.conf.json has no updater public key"
          }
          try {
            $publicKey = [Convert]::FromBase64String($encoded)
          } catch {
            throw "tauri.conf.json updater public key is not valid base64"
          }
          $publicKeyFile = Join-Path $env:RUNNER_TEMP "backlog-updater.pub"
          [IO.File]::WriteAllBytes($publicKeyFile, $publicKey)
          $encodedSignature = (Get-Content $env:SIGNATURE -Raw).Trim()
          try {
            $decodedSignature = [Convert]::FromBase64String($encodedSignature)
          } catch {
            throw "Tauri updater signature is not a valid base64-wrapped Minisign document"
          }
          $signatureFile = Join-Path $env:RUNNER_TEMP "backlog-installer.minisig"
          [IO.File]::WriteAllBytes($signatureFile, $decodedSignature)
          cargo run --locked --manifest-path src-tauri/Cargo.toml `
            --example verify_updater_signature -- `
            $env:INSTALLER $signatureFile $publicKeyFile
          if ($LASTEXITCODE -ne 0) {
            throw "Updater signature did not verify against the public key embedded in the app"
          }

      - name: Publish signed stable release
        if: steps.release-mode.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assets = @($env:INSTALLER, $env:PORTABLE, $env:SIGNATURE, $env:MANIFEST)
          $expected = @(
            (Split-Path $env:INSTALLER -Leaf),
            (Split-Path $env:PORTABLE -Leaf),
            (Split-Path $env:SIGNATURE -Leaf),
            (Split-Path $env:MANIFEST -Leaf)
          ) | Sort-Object
          $release = gh release view $env:TAG --json isDraft,name 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0) {
            if (-not $release.isDraft) { throw "$env:TAG is already published; refusing to overwrite it" }
            if ($release.name -ne "BackLog v$env:VERSION") {
              throw "Existing draft was created in a different release mode; refusing to modify it"
            }
            ./scripts/retarget-release-draft.ps1 `
              -Tag $env:TAG `
              -ExpectedSha $env:RELEASE_SHA `
              -ExpectedName "BackLog v$env:VERSION"
            ./scripts/assert-release-tag.ps1 -Tag $env:TAG -ExpectedSha $env:RELEASE_SHA
            $existingAssets = @(gh release view $env:TAG --json assets --jq ".assets[].name")
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect the existing signed draft" }
            if (@($existingAssets | Where-Object { $_ -notin $expected }).Count -ne 0) {
              throw "Signed draft has unexpected assets; refusing to modify it"
            }
            gh release upload $env:TAG @assets --clobber
          } else {
            $tag = git ls-remote --exit-code --tags origin "refs/tags/$env:TAG"
            if ($LASTEXITCODE -eq 0) {
              ./scripts/assert-release-tag.ps1 -Tag $env:TAG -ExpectedSha $env:RELEASE_SHA
              gh release create $env:TAG @assets --verify-tag --draft `
                --title "BackLog v$env:VERSION" `
                --notes-file "$env:RUNNER_TEMP\release-notes.md"
            } elseif ($LASTEXITCODE -eq 2) {
              gh release create $env:TAG @assets --target $env:RELEASE_SHA --draft `
                --title "BackLog v$env:VERSION" `
                --notes-file "$env:RUNNER_TEMP\release-notes.md"
            } else {
              throw "Could not check the release tag"
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "Stable release draft upload failed" }
          $actual = @(gh release view $env:TAG --json assets --jq ".assets[].name") | Sort-Object
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect the signed draft assets" }
          if (Compare-Object $expected $actual) {
            throw "Signed draft has missing or unexpected assets; refusing to publish it"
          }
          ./scripts/assert-release-tag.ps1 -Tag $env:TAG -ExpectedSha $env:RELEASE_SHA
          gh release edit $env:TAG --draft=false --latest `
            --title "BackLog v$env:VERSION" `
            --notes-file "$env:RUNNER_TEMP\release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw "Stable release publication failed" }
          ./scripts/assert-release-tag.ps1 -Tag $env:TAG -ExpectedSha $env:RELEASE_SHA

      - name: Publish unsigned prerelease
        if: steps.release-mode.outputs.signed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Content "$env:RUNNER_TEMP\release-notes.md" `
            "`nThis unsigned prerelease has no updater signature. v0.4.4 remains the stable updater."
          $expected = @(
            (Split-Path $env:INSTALLER -Leaf),
            (Split-Path $env:PORTABLE -Leaf)
          ) | Sort-Object
          $release = gh release view $env:TAG --json isDraft,name 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0) {
            if (-not $release.isDraft) { throw "$env:TAG is already published; refusing to overwrite it" }
            if ($release.name -ne "BackLog v$env:VERSION (unsigned prerelease)") {
              throw "Existing draft was created in a different release mode; refusing to modify it"
            }
            ./scripts/retarget-release-draft.ps1 `
              -Tag $env:TAG `
              -ExpectedSha $env:RELEASE_SHA `
              -ExpectedName "BackLog v$env:VERSION (unsigned prerelease)"
            ./scripts/assert-release-tag.ps1 -Tag $env:TAG -ExpectedSha $env:RELEASE_SHA
            $existingAssets = @(gh release view $env:TAG --json assets --jq ".assets[].name")
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect the existing unsigned draft" }
            if (@($existingAssets | Where-Object { $_ -notin $expected }).Count -ne 0) {
              throw "Unsigned draft contains updater assets; refusing to downgrade or modify it"
            }
            gh release upload $env:TAG $env:INSTALLER $env:PORTABLE --clobber
          } else {
            $tag = git ls-remote --exit-code --tags origin "refs/tags/$env:TAG"
            if ($LASTEXITCODE -eq 0) {
              ./scripts/assert-release-tag.ps1 -Tag $env:TAG -ExpectedSha $env:RELEASE_SHA
              gh release create $env:TAG $env:INSTALLER $env:PORTABLE --verify-tag --draft `
                --title "BackLog v$env:VERSION (unsigned prerelease)" `
                --notes-file "$env:RUNNER_TEMP\release-notes.md"
            } elseif ($LASTEXITCODE -eq 2) {
              gh release create $env:TAG $env:INSTALLER $env:PORTABLE --target $env:RELEASE_SHA --draft `
                --title "BackLog v$env:VERSION (unsigned prerelease)" `
                --notes-file "$env:RUNNER_TEMP\release-notes.md"
            } else {
              throw "Could not check the release tag"
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "Prerelease draft upload failed" }
          $actual = @(gh release view $env:TAG --json assets --jq ".assets[].name")
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect the unsigned draft assets" }
          if (Compare-Object $expected $actual) {
            throw "Unsigned draft has missing or forbidden updater assets; refusing to publish it"
          }
          ./scripts/assert-release-tag.ps1 -Tag $env:TAG -ExpectedSha $env:RELEASE_SHA
          gh release edit $env:TAG --draft=false --prerelease `
            --title "BackLog v$env:VERSION (unsigned prerelease)" `
            --notes-file "$env:RUNNER_TEMP\release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw "Prerelease publication failed" }
          ./scripts/assert-release-tag.ps1 -Tag $env:TAG -ExpectedSha $env:RELEASE_SHA
