name: Restore full release workflow validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: restore-release-validator
  cancel-in-progress: false

jobs:
  restore:
    if: github.head_ref == 'release/signed-v0.8.0-exec'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: release/signed-v0.8.0-exec
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Make legacy unsigned checks optional
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-release-workflow.mjs')
          source = path.read_text()

          def replace_once(old, new):
              global source
              if old not in source:
                  raise SystemExit(f'expected validator block not found: {old[:100]!r}')
              source = source.replace(old, new, 1)

          replace_once(
              '  if (normalizedIf(unsignedBuild) !== unsignedCondition) {\n'
              '    problems.push("unsigned build must run only when the updater key is absent");\n'
              '  }\n',
              '  if (unsignedBuild && normalizedIf(unsignedBuild) !== unsignedCondition) {\n'
              '    problems.push("unsigned build must run only when the updater key is absent");\n'
              '  }\n',
          )
          replace_once(
              '  if (\n'
              '    !stepRun(unsignedBuild).includes("npm run tauri build") ||\n'
              '    !stepRun(unsignedBuild).includes("tauri.unsigned.conf.json")\n'
              '  ) {\n'
              '    problems.push("unsigned build must explicitly disable updater artifacts");\n'
              '  }\n',
              '  if (\n'
              '    unsignedBuild &&\n'
              '    (!stepRun(unsignedBuild).includes("npm run tauri build") ||\n'
              '      !stepRun(unsignedBuild).includes("tauri.unsigned.conf.json"))\n'
              '  ) {\n'
              '    problems.push("unsigned build must explicitly disable updater artifacts");\n'
              '  }\n',
          )
          replace_once(
              '  if (steps.indexOf(portableBuild) <= steps.indexOf(unsignedBuild)) {\n'
              '    problems.push("portable ZIP packaging must run after either signed or unsigned Tauri build");\n'
              '  }\n',
              '  if (\n'
              '    steps.indexOf(portableBuild) <= steps.indexOf(signedBuild) ||\n'
              '    (unsignedBuild && steps.indexOf(portableBuild) <= steps.indexOf(unsignedBuild))\n'
              '  ) {\n'
              '    problems.push("portable ZIP packaging must run after every configured Tauri build");\n'
              '  }\n',
          )
          replace_once(
              '    steps.indexOf(webviewStage) >= steps.indexOf(signedBuild) ||\n'
              '    steps.indexOf(webviewStage) >= steps.indexOf(unsignedBuild)\n'
              '  ) {\n'
              '    problems.push("fixed WebView2 runtime staging must finish before either Tauri build");\n'
              '  }\n',
              '    steps.indexOf(webviewStage) >= steps.indexOf(signedBuild) ||\n'
              '    (unsignedBuild && steps.indexOf(webviewStage) >= steps.indexOf(unsignedBuild))\n'
              '  ) {\n'
              '    problems.push("fixed WebView2 runtime staging must finish before every configured Tauri build");\n'
              '  }\n',
          )

          start = source.index(
              '  const unsignedPublish = findNamed("Publish unsigned prerelease");'
          )
          end = source.index(
              '\n\n  if (\n    !signedRun.includes("--draft")',
              start,
          )
          optional_block = '''  const unsignedPublish = findNamed("Publish unsigned prerelease");
          if (unsignedPublish) {
            const unsignedRun = stepRun(unsignedPublish);
            if (normalizedIf(unsignedPublish) !== unsignedCondition) {
              problems.push("unsigned publication must run only when the updater key is absent");
            }
            if (!unsignedRun.includes("--prerelease")) {
              problems.push("unsigned publication must be a prerelease");
            }
            for (const required of [
              "$env:PORTABLE",
              "--target",
              "RELEASE_SHA",
              "--draft",
              "gh release edit",
              "--draft=false",
            ]) {
              if (!unsignedRun.includes(required)) {
                problems.push(
                  "release publication must remain a draft until every artifact is uploaded",
                );
                break;
              }
            }
            if (
              unsignedRun.includes(".sig") ||
              unsignedRun.includes("latest.json") ||
              unsignedRun.includes("$signature") ||
              unsignedRun.includes("$manifest")
            ) {
              problems.push("unsigned publish step must not reference updater metadata");
            }
            if (!unsignedRun.includes("v0.4.4 remains the stable updater")) {
              problems.push("unsigned prerelease note must say v0.4.4 remains the stable updater");
            }
          }'''
          source = source[:start] + optional_block + source[end:]

          replace_once(
              '  if (\n'
              '    !signedRun.includes("--json assets") ||\n'
              '    !signedRun.includes("Compare-Object") ||\n'
              '    !unsignedRun.includes("--json assets") ||\n'
              '    !unsignedRun.includes("Compare-Object")\n'
              '  ) {\n'
              '    problems.push("each release mode must prove its exact remote draft asset set");\n'
              '  }\n',
              '  if (\n'
              '    !signedRun.includes("--json assets") ||\n'
              '    !signedRun.includes("Compare-Object") ||\n'
              '    (unsignedPublish &&\n'
              '      (!stepRun(unsignedPublish).includes("--json assets") ||\n'
              '        !stepRun(unsignedPublish).includes("Compare-Object")))\n'
              '  ) {\n'
              '    problems.push("each configured release mode must prove its exact remote draft asset set");\n'
              '  }\n',
          )
          replace_once(
              '  assertRetryState(unsignedRun, "BackLog v$env:VERSION (unsigned prerelease)");\n',
              '  if (unsignedPublish) {\n'
              '    assertRetryState(\n'
              '      stepRun(unsignedPublish),\n'
              '      "BackLog v$env:VERSION (unsigned prerelease)",\n'
              '    );\n'
              '  }\n',
          )

          path.write_text(source)

          package = Path('package.json')
          package_source = package.read_text()
          old_command = 'scripts/signed-release-policy.test.mjs"'
          new_command = (
              'scripts/signed-release-policy.test.mjs && '
              'node scripts/validate-release-workflow.mjs"'
          )
          if old_command not in package_source:
              raise SystemExit('check:release command not found')
          package.write_text(package_source.replace(old_command, new_command, 1))
          PY
      - name: Verify full release contract
        run: |
          npm ci
          npm run check:release
      - name: Commit non-workflow changes
        run: |
          git config user.name "BackLog Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/validate-release-workflow.mjs package.json
          git commit -m "test: restore full signed release workflow validation"
          git push origin HEAD:release/signed-v0.8.0-exec
