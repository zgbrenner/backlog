name: Apply signed release implementation

on:
  push:
    branches: [release/signed-v0.8.0-exec]

permissions:
  contents: write

concurrency:
  group: apply-signed-release-fix
  cancel-in-progress: false

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[signed-release-fix]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: release/signed-v0.8.0-exec
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Patch signed release policy and repair workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Fail closed when the established updater private key is unavailable.
          replace_once(
              "scripts/release-contract.mjs",
              '''export function releasePlan(privateKey) {
            const signed = typeof privateKey === "string" && privateKey.trim().length > 0;
            return {
              signed,
              prerelease: !signed,
              publishUpdater: signed,
            };
          }
          ''',
              '''export function releasePlan(privateKey) {
            const signed = typeof privateKey === "string" && privateKey.trim().length > 0;
            if (!signed) {
              throw new Error(
                "TAURI_SIGNING_PRIVATE_KEY is required for stable release publication",
              );
            }
            return {
              signed: true,
              prerelease: false,
              publishUpdater: true,
            };
          }
          ''',
          )
          replace_once(
              "scripts/release-contract.mjs",
              '''    console.log(
                plan.signed
                  ? "Updater key available: stable signed publication enabled."
                  : "Updater key absent: unsigned prerelease selected.",
              );
          ''',
              '''    console.log("Updater key available: stable signed publication enabled.");
          ''',
          )

          replace_once(
              "scripts/release-contract.test.mjs",
              '''test("an absent updater key selects an unsigned prerelease", () => {
            assert.deepEqual(releasePlan(""), {
              signed: false,
              prerelease: true,
              publishUpdater: false,
            });
            assert.deepEqual(releasePlan(" \\r\\n\\t"), {
              signed: false,
              prerelease: true,
              publishUpdater: false,
            });
          });
          ''',
              '''test("an absent updater key fails closed", () => {
            assert.throws(
              () => releasePlan(""),
              /TAURI_SIGNING_PRIVATE_KEY is required/,
            );
            assert.throws(
              () => releasePlan(" \\r\\n\\t"),
              /TAURI_SIGNING_PRIVATE_KEY is required/,
            );
          });
          ''',
          )

          # Remove the unsigned fallback from the normal release workflow.
          workflow_path = Path(".github/workflows/release.yml")
          workflow = workflow_path.read_text()
          workflow, count = re.subn(
              r'''\n      - name: Build unsigned installer\n        if: steps\.release-mode\.outputs\.signed == 'false'\n        run: npm run tauri build -- --config scripts/tauri\.unsigned\.conf\.json\n''',
              "\n",
              workflow,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not remove unsigned build step")
          workflow, count = re.subn(
              r'''\n      - name: Publish unsigned prerelease\n.*\Z''',
              "\n",
              workflow,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("could not remove unsigned publish step")
          workflow_path.write_text(workflow)

          # Keep the mature workflow validator compatible with signed-only workflows.
          validator_path = Path("scripts/validate-release-workflow.mjs")
          validator = validator_path.read_text()
          validator = validator.replace(
              '''  if (normalizedIf(unsignedBuild) !== unsignedCondition) {
            problems.push("unsigned build must run only when the updater key is absent");
          }
          ''',
              '''  if (unsignedBuild && normalizedIf(unsignedBuild) !== unsignedCondition) {
            problems.push("unsigned build must run only when the updater key is absent");
          }
          ''',
              1,
          )
          validator = validator.replace(
              '''  if (
            !stepRun(unsignedBuild).includes("npm run tauri build") ||
            !stepRun(unsignedBuild).includes("tauri.unsigned.conf.json")
          ) {
            problems.push("unsigned build must explicitly disable updater artifacts");
          }
          ''',
              '''  if (
            unsignedBuild &&
            (!stepRun(unsignedBuild).includes("npm run tauri build") ||
              !stepRun(unsignedBuild).includes("tauri.unsigned.conf.json"))
          ) {
            problems.push("unsigned build must explicitly disable updater artifacts");
          }
          ''',
              1,
          )
          validator = validator.replace(
              '''  if (steps.indexOf(portableBuild) <= steps.indexOf(unsignedBuild)) {
            problems.push("portable ZIP packaging must run after either signed or unsigned Tauri build");
          }
          ''',
              '''  if (
            steps.indexOf(portableBuild) <= steps.indexOf(signedBuild) ||
            (unsignedBuild && steps.indexOf(portableBuild) <= steps.indexOf(unsignedBuild))
          ) {
            problems.push("portable ZIP packaging must run after every configured Tauri build");
          }
          ''',
              1,
          )
          validator = validator.replace(
              '''    steps.indexOf(webviewStage) >= steps.indexOf(signedBuild) ||
            steps.indexOf(webviewStage) >= steps.indexOf(unsignedBuild)
          ) {
            problems.push("fixed WebView2 runtime staging must finish before either Tauri build");
          }
          ''',
              '''    steps.indexOf(webviewStage) >= steps.indexOf(signedBuild) ||
            (unsignedBuild && steps.indexOf(webviewStage) >= steps.indexOf(unsignedBuild))
          ) {
            problems.push("fixed WebView2 runtime staging must finish before every configured Tauri build");
          }
          ''',
              1,
          )
          unsigned_start = validator.index('  const unsignedPublish = findNamed("Publish unsigned prerelease");')
          unsigned_end = validator.index('\n  if (\n    !signedRun.includes("--draft")', unsigned_start)
          unsigned_block = validator[unsigned_start:unsigned_end]
          indented = "\n".join("  " + line if line else line for line in unsigned_block.splitlines())
          validator = validator[:unsigned_start] + '''  const unsignedPublish = findNamed("Publish unsigned prerelease");
            if (unsignedPublish) {
          ''' + indented.split("\n", 2)[2] + '''
            }
          ''' + validator[unsigned_end:]
          validator = validator.replace(
              '''    !signedRun.includes("--json assets") ||
            !signedRun.includes("Compare-Object") ||
            !unsignedRun.includes("--json assets") ||
            !unsignedRun.includes("Compare-Object")
          ) {
            problems.push("each release mode must prove its exact remote draft asset set");
          }
          ''',
              '''    !signedRun.includes("--json assets") ||
            !signedRun.includes("Compare-Object") ||
            (unsignedPublish &&
              (!stepRun(unsignedPublish).includes("--json assets") ||
                !stepRun(unsignedPublish).includes("Compare-Object")))
          ) {
            problems.push("each configured release mode must prove its exact remote draft asset set");
          }
          ''',
              1,
          )
          validator = validator.replace(
              '''  assertRetryState(unsignedRun, "BackLog v$env:VERSION (unsigned prerelease)");
          ''',
              '''  if (unsignedPublish) {
            assertRetryState(stepRun(unsignedPublish), "BackLog v$env:VERSION (unsigned prerelease)");
          }
          ''',
              1,
          )
          validator_path.write_text(validator)

          # Correct the durable release checklist and document the one-time repair.
          checklist_path = Path("docs/RELEASE_CHECKLIST.md")
          checklist = checklist_path.read_text()
          publication = '''## Publication guard

          - [ ] `v0.8.0` remains permanently attached to commit
                `74e31fbd2b31ad99ceaf5390bb27fb197fc706a7`; the repair workflow never
                moves, deletes, or recreates the tag.
          - [ ] `TAURI_SIGNING_PRIVATE_KEY` is present and matches the updater public
                key embedded in the tagged app. A missing or mismatched key fails the
                workflow without changing the published release.
          - [ ] The stable release contains exactly these four downloadable assets:
                `BackLog_0.8.0_x64-setup.exe`,
                `BackLog_0.8.0_x64-portable.zip`,
                `BackLog_0.8.0_x64-setup.exe.sig`, and `latest.json`.
          - [ ] The detached signature matches `latest.json`, cryptographically
                verifies against the updater public key embedded in the tagged app,
                and covers the exact published installer bytes.
          - [ ] The installer and portable ZIP SHA-256 values are included in the
                release notes and match freshly downloaded public assets.
          - [ ] The release is neither a draft nor a prerelease, is marked Latest,
                and `releases/latest/download/latest.json` resolves to this release.
          - [ ] No signature was generated, copied, or fabricated outside the Tauri
                signing path.
          - [ ] Updater signing and Authenticode are recorded separately: updater
                signing protects installed-app updates; Authenticode identifies the
                Windows publisher and affects SmartScreen.
          '''
          checklist = re.sub(r"## Publication guard\n.*\Z", publication, checklist, flags=re.S)
          checklist_path.write_text(checklist)

          releasing_path = Path("RELEASING.md")
          releasing = releasing_path.read_text()
          signed_modes = '''## Signing policy

          Stable BackLog releases require the existing Tauri updater signing key.
          Configure `TAURI_SIGNING_PRIVATE_KEY` with the private key matching the
          updater public key embedded in `src-tauri/tauri.conf.json`; set
          `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` only when that key is password protected.

          The release workflow fails closed when the key is absent. It does not publish
          an unsigned fallback, synthesize a signature, or rotate the updater key. A
          signed release must contain the installer, portable ZIP, detached `.sig`, and
          `latest.json`. The workflow verifies the detached signature against the public
          key embedded in the exact app build before publication.

          Never rotate this updater key casually. Existing installations verify updates
          against the public key they already contain; losing or replacing its private
          half breaks that update chain.

          ### One-time v0.8.0 repair

          `.github/workflows/repair-v0.8.0.yml` repairs the already-published unsigned
          v0.8.0 prerelease. It checks out the immutable `v0.8.0` tag at
          `74e31fbd2b31ad99ceaf5390bb27fb197fc706a7`, rebuilds and signs those exact
          sources, verifies the signature against the tagged app's embedded public key,
          replaces the two existing downloads, adds the `.sig` and `latest.json`, and
          promotes the same release to stable Latest. It never moves or recreates the
          tag. A missing or mismatched private key leaves the prerelease unchanged.

          Tauri updater signing and Windows Authenticode remain separate trust
          boundaries. BackLog does not yet have a trusted Authenticode certificate, so
          Windows SmartScreen can still warn on a correctly updater-signed installer.

          ## Trigger and clean skip
          '''
          releasing = re.sub(
              r"## Signing modes\n.*?## Trigger and clean skip\n",
              signed_modes,
              releasing,
              count=1,
              flags=re.S,
          )
          releasing_path.write_text(releasing)

          dollar = "$"
          repair = r'''name: Repair signed BackLog v0.8.0

          on:
            push:
              branches: [main]

          permissions:
            contents: read

          concurrency:
            group: repair-signed-v0.8.0
            cancel-in-progress: false

          env:
            REPAIR_TAG: v0.8.0
            REPAIR_SHA: 74e31fbd2b31ad99ceaf5390bb27fb197fc706a7
            VERSION: 0.8.0

          jobs:
            preflight:
              name: Verify immutable v0.8.0 release state
              runs-on: ubuntu-24.04
              outputs:
                should-repair: §{{ steps.state.outputs.should_repair }}
              env:
                GH_TOKEN: §{{ github.token }}
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                  with:
                    fetch-depth: 0
                    ref: §{{ env.REPAIR_TAG }}
                - name: Verify immutable tag target
                  shell: pwsh
                  run: |
                    §actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
                    if (§actual -ne §env:REPAIR_SHA) {
                      throw "§env:REPAIR_TAG resolves to §actual, expected §env:REPAIR_SHA"
                    }
                    ./scripts/assert-release-tag.ps1 -Tag §env:REPAIR_TAG -ExpectedSha §env:REPAIR_SHA
                - name: Inspect published release
                  id: state
                  shell: pwsh
                  run: |
                    §ErrorActionPreference = "Stop"
                    §release = gh release view §env:REPAIR_TAG --json isDraft,isPrerelease,name,tagName,assets | ConvertFrom-Json
                    if (§LASTEXITCODE -ne 0) { throw "Could not inspect §env:REPAIR_TAG" }
                    if (§release.tagName -ne §env:REPAIR_TAG) { throw "Release tag mismatch" }
                    if (§release.isDraft) { throw "§env:REPAIR_TAG must already be published" }
                    §expected = @(
                      "BackLog_0.8.0_x64-setup.exe",
                      "BackLog_0.8.0_x64-portable.zip",
                      "BackLog_0.8.0_x64-setup.exe.sig",
                      "latest.json"
                    ) | Sort-Object
                    §actual = @(§release.assets | ForEach-Object { §_.name }) | Sort-Object
                    §complete = -not §release.isPrerelease -and -not (Compare-Object §expected §actual)
                    "should_repair=§((!§complete).ToString().ToLowerInvariant())" >> §env:GITHUB_OUTPUT
                    if (§complete) { Write-Host "v0.8.0 is already a complete signed stable release." }

            repair:
              name: Rebuild, sign, verify, and promote exact v0.8.0
              needs: preflight
              if: needs.preflight.outputs.should-repair == 'true'
              runs-on: windows-2022
              timeout-minutes: 180
              permissions:
                contents: write
              env:
                GH_TOKEN: §{{ github.token }}
                INSTALLER: src-tauri/target/release/bundle/nsis/BackLog_0.8.0_x64-setup.exe
                PORTABLE: src-tauri/target/release/BackLog_0.8.0_x64-portable.zip
                SIGNATURE: src-tauri/target/release/bundle/nsis/BackLog_0.8.0_x64-setup.exe.sig
                MANIFEST: src-tauri/target/release/bundle/nsis/latest.json
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                  with:
                    fetch-depth: 0
                    ref: §{{ env.REPAIR_TAG }}
                - name: Verify exact tagged source
                  shell: pwsh
                  run: |
                    §actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
                    if (§actual -ne §env:REPAIR_SHA) { throw "Immutable v0.8.0 source mismatch" }
                    ./scripts/assert-release-tag.ps1 -Tag §env:REPAIR_TAG -ExpectedSha §env:REPAIR_SHA
                - name: Require the established updater private key
                  env:
                    TAURI_SIGNING_PRIVATE_KEY: §{{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  shell: pwsh
                  run: |
                    if ([string]::IsNullOrWhiteSpace(§env:TAURI_SIGNING_PRIVATE_KEY)) {
                      throw "TAURI_SIGNING_PRIVATE_KEY is required; refusing to rotate or replace the updater key."
                    }
                - name: Set runner-local release paths
                  shell: pwsh
                  run: |
                    §runtimeDir = Join-Path §env:RUNNER_TEMP "backlog-webview2-fixed"
                    "WEBVIEW2_RUNTIME_DIR=§runtimeDir" >> §env:GITHUB_ENV
                - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                  with:
                    node-version: 22
                    cache: npm
                - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
                  with:
                    python-version: "3.11"
                    architecture: x64
                    cache: pip
                    cache-dependency-path: |
                      sidecar/requirements.lock
                      sidecar/build-requirements.lock
                      power-automate/requirements-dev.txt
                - name: Install pinned Rust toolchain
                  shell: pwsh
                  run: |
                    §match = Select-String -Path rust-toolchain.toml -Pattern 'channel\s*=\s*"([^"]+)"'
                    if (-not §match) { throw "rust-toolchain.toml has no pinned channel" }
                    §toolchain = §match.Matches[0].Groups[1].Value
                    rustup toolchain install §toolchain --profile minimal --component rustfmt --component clippy
                    rustup override set §toolchain
                    if (§LASTEXITCODE -ne 0) { throw "Could not activate pinned Rust" }
                - name: Select native Windows build tools
                  shell: pwsh
                  run: |
                    §nasmVersion = "2.16.03"
                    §nasmHash = "3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6"
                    §nativeRoot = Join-Path §env:RUNNER_TEMP "backlog-native-tools"
                    §nasmArchive = Join-Path §nativeRoot "nasm-§nasmVersion-win64.zip"
                    New-Item -ItemType Directory -Path §nativeRoot -Force | Out-Null
                    Invoke-WebRequest -Uri "https://www.nasm.us/pub/nasm/releasebuilds/§nasmVersion/win64/nasm-§nasmVersion-win64.zip" -OutFile §nasmArchive
                    §actualHash = (Get-FileHash §nasmArchive -Algorithm SHA256).Hash.ToLowerInvariant()
                    if (§actualHash -ne §nasmHash) { throw "NASM hash mismatch" }
                    Expand-Archive §nasmArchive -DestinationPath §nativeRoot -Force
                    §nasmDir = Join-Path §nativeRoot "nasm-§nasmVersion"
                    foreach (§path in @("C:\Strawberry\perl\bin", "C:\Strawberry\c\bin", §nasmDir)) {
                      if (-not (Test-Path §path)) { throw "Required build tool path missing: §path" }
                      §path | Out-File §env:GITHUB_PATH -Encoding utf8 -Append
                    }
                    §actualPerl = perl --version
                    §perlExit = §LASTEXITCODE
                    §perlText = §actualPerl -join "`n"
                    if (§perlExit -ne 0 -or §perlText -notmatch "built for MSWin32-x64") { throw "Native x64 Perl unavailable" }
                - name: Install locked dependencies
                  shell: pwsh
                  run: |
                    npm ci
                    if (§LASTEXITCODE -ne 0) { throw "npm ci failed" }
                    python -m pip install --disable-pip-version-check -r power-automate/requirements-dev.txt
                    if (§LASTEXITCODE -ne 0) { throw "Power Automate dependency install failed" }
                - name: Validate tagged source
                  shell: pwsh
                  run: |
                    npm run check:release
                    npm run check
                    python power-automate/validate_examples.py
                - name: Stage verified release inputs
                  shell: pwsh
                  run: ./scripts/stage-release-inputs.ps1 -Clean
                - name: Stage pinned fixed WebView2 runtime
                  shell: pwsh
                  run: ./scripts/stage-webview2-runtime.ps1 -Destination §env:WEBVIEW2_RUNTIME_DIR -Clean
                - name: Build sidecar
                  shell: pwsh
                  run: ./scripts/build-sidecar.ps1 -Python (Get-Command python).Source -Clean
                - name: Verify release binaries
                  shell: pwsh
                  run: |
                    ./scripts/verify-binaries.ps1 -Expected @{
                      "llama-server-x86_64-pc-windows-msvc.exe" = "78af9cfb34f346b0de1e4f9c1577061cb3d55e8be55c8d540fde878e56bd0fe2"
                    }
                - name: Build signed installer
                  env:
                    TAURI_SIGNING_PRIVATE_KEY: §{{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                    TAURI_SIGNING_PRIVATE_KEY_PASSWORD: §{{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  run: npm run tauri build
                - name: Build installer-free portable ZIP
                  shell: pwsh
                  run: ./scripts/package-portable.ps1 -Version §env:VERSION -Output §env:PORTABLE -WebView2RuntimeDir §env:WEBVIEW2_RUNTIME_DIR
                - name: Verify installer-free portable ZIP
                  shell: pwsh
                  run: ./scripts/validate-portable-package.ps1 -Archive §env:PORTABLE -Version §env:VERSION
                - name: Write signed release notes
                  shell: pwsh
                  run: |
                    §installerSha = (Get-FileHash §env:INSTALLER -Algorithm SHA256).Hash.ToLowerInvariant()
                    §portableSha = (Get-FileHash §env:PORTABLE -Algorithm SHA256).Hash.ToLowerInvariant()
                    @"
                    BackLog 0.8.0 is the stable, updater-signed Windows release.

                    Downloads:
                    - BackLog_0.8.0_x64-setup.exe
                    - BackLog_0.8.0_x64-portable.zip
                    - BackLog_0.8.0_x64-setup.exe.sig
                    - latest.json

                    Installer SHA-256: §installerSha
                    Portable ZIP SHA-256: §portableSha

                    The updater signature is verified against the public key embedded in
                    this exact tagged build. This is Tauri updater signing, not Windows
                    Authenticode; SmartScreen may still display a warning.
                    "@ | Set-Content "§env:RUNNER_TEMP\release-notes.md" -Encoding utf8
                - name: Create signed updater manifest
                  shell: pwsh
                  run: |
                    node scripts/release-contract.mjs manifest `
                      --version §env:VERSION `
                      --repository §env:GITHUB_REPOSITORY `
                      --installer (Split-Path §env:INSTALLER -Leaf) `
                      --signature §env:SIGNATURE `
                      --notes "§env:RUNNER_TEMP\release-notes.md" `
                      --out §env:MANIFEST
                - name: Verify guarded artifact set
                  shell: pwsh
                  run: |
                    node scripts/release-contract.mjs verify --signed true --installer §env:INSTALLER --signature §env:SIGNATURE --manifest §env:MANIFEST
                - name: Verify updater signature against embedded public key
                  shell: pwsh
                  run: |
                    §config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
                    §publicKey = [Convert]::FromBase64String([string]§config.plugins.updater.pubkey)
                    §publicKeyFile = Join-Path §env:RUNNER_TEMP "backlog-updater.pub"
                    [IO.File]::WriteAllBytes(§publicKeyFile, §publicKey)
                    §encodedSignature = (Get-Content §env:SIGNATURE -Raw).Trim()
                    §decodedSignature = [Convert]::FromBase64String(§encodedSignature)
                    §signatureFile = Join-Path §env:RUNNER_TEMP "backlog-installer.minisig"
                    [IO.File]::WriteAllBytes(§signatureFile, §decodedSignature)
                    cargo run --locked --manifest-path src-tauri/Cargo.toml --example verify_updater_signature -- §env:INSTALLER §signatureFile §publicKeyFile
                    if (§LASTEXITCODE -ne 0) { throw "Updater key mismatch; refusing to publish" }
                - name: Replace assets and promote the same immutable release
                  shell: pwsh
                  run: |
                    §ErrorActionPreference = "Stop"
                    ./scripts/assert-release-tag.ps1 -Tag §env:REPAIR_TAG -ExpectedSha §env:REPAIR_SHA
                    §expected = @(
                      (Split-Path §env:INSTALLER -Leaf),
                      (Split-Path §env:PORTABLE -Leaf),
                      (Split-Path §env:SIGNATURE -Leaf),
                      (Split-Path §env:MANIFEST -Leaf)
                    ) | Sort-Object
                    §release = gh release view §env:REPAIR_TAG --json isDraft,isPrerelease,name,tagName,assets | ConvertFrom-Json
                    if (§release.isDraft) { throw "Refusing to repair a draft" }
                    if (§release.tagName -ne §env:REPAIR_TAG) { throw "Release tag mismatch" }
                    §existing = @(§release.assets | ForEach-Object { §_.name })
                    if (@(§existing | Where-Object { §_ -notin §expected }).Count -ne 0) {
                      throw "Release has unexpected assets; refusing mutation"
                    }
                    §assets = @(§env:INSTALLER, §env:PORTABLE, §env:SIGNATURE, §env:MANIFEST)
                    gh release upload §env:REPAIR_TAG @assets --clobber
                    if (§LASTEXITCODE -ne 0) { throw "Signed asset upload failed" }
                    §actual = @(gh release view §env:REPAIR_TAG --json assets --jq ".assets[].name") | Sort-Object
                    if (Compare-Object §expected §actual) { throw "Remote signed asset set is incomplete" }
                    ./scripts/assert-release-tag.ps1 -Tag §env:REPAIR_TAG -ExpectedSha §env:REPAIR_SHA
                    gh release edit §env:REPAIR_TAG --prerelease=false --latest --title "BackLog v0.8.0" --notes-file "§env:RUNNER_TEMP\release-notes.md"
                    if (§LASTEXITCODE -ne 0) { throw "Stable release promotion failed" }
                    ./scripts/assert-release-tag.ps1 -Tag §env:REPAIR_TAG -ExpectedSha §env:REPAIR_SHA
                    §final = gh release view §env:REPAIR_TAG --json isDraft,isPrerelease,assets | ConvertFrom-Json
                    §finalAssets = @(§final.assets | ForEach-Object { §_.name }) | Sort-Object
                    if (§final.isDraft -or §final.isPrerelease -or (Compare-Object §expected §finalAssets)) {
                      throw "Published v0.8.0 did not pass final release verification"
                    }
          '''.replace("§", dollar)
          Path(".github/workflows/repair-v0.8.0.yml").write_text(repair)

          # The temporary patcher deletes itself before committing.
          Path(".github/workflows/apply-signed-release-fix.yml").unlink()
          PY

      - name: Verify implementation
        run: |
          npm ci
          npm run check:release
      - name: Commit verified implementation
        run: |
          git config user.name "BackLog Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: require signed releases and repair v0.8.0 [signed-release-fix]"
          git push origin HEAD:release/signed-v0.8.0-exec
