name: Export current source snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'feature/semantic-evidence-v0.6.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Archive exact source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/backlog-current-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: backlog-current-source
          path: ${{ runner.temp }}/backlog-current-source.tar.gz
          if-no-files-found: error
          retention-days: 1
