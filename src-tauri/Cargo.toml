[package]
name = "backlog"
version = "0.9.1"
edition = "2021"
description = "Local document naming and indexing pipeline"

[workspace]
members = ["core"]

[lib]
name = "backlog_lib"
# No cdylib: Tauri emits it for mobile targets this app does not build, and a
# debug cdylib of this crate exceeds the PE 64k export-ordinal limit, so GNU
# linkers refuse it ("export ordinal too large") and no windows-gnu build of
# the app or its tests can link at all.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
backlog-core = { path = "core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# SQLCipher (whole-DB encryption at rest for ledger.db) instead of plain
# SQLite. "-vendored-openssl" builds OpenSSL from source at compile time
# (needs a Windows-native perl + nasm; see scripts/dev-stubs.ps1 comment /
# README for the Strawberry Perl requirement) so no system OpenSSL install is
# required on the build or target machine.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "0.11"
hex = "0.4"
infer = "0.16"
notify = "8"
notify-debouncer-full = "0.7"
chrono = { version = "0.4", features = ["serde"] }
# CSPRNG for the 32-byte SQLCipher key (dbkey.rs). Version pinned to match
# what's already resolved transitively so this doesn't pull in a second copy.
# "std" is required explicitly (not on by default) so getrandom::Error
# implements std::error::Error and `?` can convert it into anyhow::Error.
getrandom = { version = "0.2", features = ["std"] }
# "stream" backs model_download.rs's chunked GGUF/safetensors downloads
# (Response::bytes_stream) so a multi-GB file is never buffered whole in
# memory.
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
# Regular (not dev-only) dependency: preflight.rs's own #[cfg(test)] module
# (compiled as part of the normal lib target) needs it for its
# writable-directory probe tests.
tempfile = "3"

[dev-dependencies]
# The release-only example verifies the updater artifact with exactly the same
# zero-dependency Minisign implementation already resolved by the updater
# plugin. It is an independent publication gate, not app runtime code.
minisign-verify = "=0.2.5"

# DPAPI (CryptProtectData/CryptUnprotectData) protects the SQLCipher key at
# rest — see dbkey.rs. Windows-only on purpose: gating it here (rather than
# depending on it unconditionally) is what lets the whole app crate compile and
# run its test suite on Linux/macOS, so CI can exercise the ledger, pipeline,
# manifest, and checker logic on a cheap Linux runner instead of only on a
# Windows box. `bundle.targets` is NSIS-only, so the shipped artifact always
# takes the real DPAPI path below.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    # watcher.rs reads reparse TAGS (WIN32_FIND_DATAW.dwReserved0) to tell a
    # OneDrive Files On-Demand placeholder from a symlink/junction.
    "Win32_Storage_FileSystem",
] }

[profile.release]
lto = true
opt-level = "z"
strip = true
