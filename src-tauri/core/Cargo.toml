[package]
name = "backlog-core"
version = "0.1.0"
edition = "2021"
description = "BackLog deterministic trust core: evidence harvest + validator. Pure logic, no Tauri, so it tests without any app build."

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# NFC before the subject rules run: a decomposed "é" must be one character for
# the length bound and one character in the name SharePoint stores.
unicode-normalization = "0.1"
